name: Backend External Provider Contracts

on:
  workflow_dispatch:

jobs:
  external:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RUN_AI_EXTERNAL_TESTS: "true"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: ${{ secrets.GEMINI_TEXT_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_TEXT_MODEL: ${{ secrets.GROQ_TEXT_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_REASONING_MODEL: ${{ secrets.OPENROUTER_REASONING_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:external -- --runInBand
