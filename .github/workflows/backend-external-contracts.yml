name: Backend External Contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external:
    runs-on: ubuntu-latest
    environment: external-contract-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:external -- --runInBand
