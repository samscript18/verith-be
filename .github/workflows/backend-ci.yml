name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/verith_ci
      REDIS_URL: redis://127.0.0.1:6379/1
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      HASHING_PEPPER: ci-hashing-pepper-with-at-least-32-characters
      DATA_EXPORT_ENCRYPTION_KEY: ci-export-key-with-at-least-32-characters
      MASTER_ENCRYPTION_KEY: ci-master-key-with-at-least-32-characters
      WHATSAPP_ENABLED: "false"
      PROCESS_ROLE: all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run db:indexes:check
      - run: docker build --build-arg VCS_REF=${{ github.sha }} -t verith-backend:ci .
