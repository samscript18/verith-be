name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/verith_ci
      REDIS_URL: redis://127.0.0.1:6379/1
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      HASHING_PEPPER: ci-hashing-pepper-with-at-least-32-characters
      DATA_EXPORT_ENCRYPTION_KEY: ci-export-key-with-at-least-32-characters
      MASTER_ENCRYPTION_KEY: ci-master-key-with-at-least-32-characters
      WHATSAPP_ENABLED: "false"
      PROCESS_ROLE: all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run test:integration -- --runInBand
        env:
          WHATSAPP_ENABLED: "true"
          WHATSAPP_PHONE_NUMBER_ID: ci-phone-number
          WHATSAPP_BUSINESS_ACCOUNT_ID: ci-business-account
          WHATSAPP_ACCESS_TOKEN: ci-access-token
          WHATSAPP_APP_SECRET: ci-app-secret
          WHATSAPP_VERIFY_TOKEN: ci-verify-token
          WHATSAPP_API_VERSION: v23.0
          CLOUDINARY_CLOUD_NAME: ci-cloud
          CLOUDINARY_API_KEY: ci-api-key
          CLOUDINARY_API_SECRET: ci-api-secret
      - run: npm run test:e2e -- --runInBand
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: docker build -t verith-backend:ci .
